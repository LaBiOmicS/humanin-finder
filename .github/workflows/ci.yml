name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.2
        with:
          cache: false
          locked: false

      - name: Install dependencies
        run: pixi run setup

      - name: Run Linting
        run: pixi run ruff check src/

      - name: Run Tests
        run: pixi run test

      - name: Verify Build
        run: pixi run build-pkg
