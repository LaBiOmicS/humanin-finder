name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          init-shell: bash
          cache-environment: true

      - name: Install Package
        shell: bash -l {0}
        run: pip install -e .

      - name: Run Linting
        shell: bash -l {0}
        run: |
          pip install ruff
          ruff check src/

      - name: Run Tests
        shell: bash -l {0}
        run: pytest tests/

      - name: Verify Build
        shell: bash -l {0}
        run: |
          pip install build
          python -m build
